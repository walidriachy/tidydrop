name: Feature request
description: Suggest an improvement, new rule capability, or UI enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the messy Downloads scenario or workflow pain point.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like TidyDrop to behave?
    validations:
      required: true
