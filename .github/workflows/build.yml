# Builds the Windows installer and the Mac disk image on GitHub's own machines.
# Every push runs the tests and builds both. Pushing a tag like "v1.0.1"
# also publishes a Release with "TidyDrop Setup.exe" and "TidyDrop.dmg" attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Build Mac disk image
        if: runner.os == 'macOS'
        run: bash scripts/build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: TidyDrop-${{ runner.os }}
          path: |
            dist/TidyDrop Setup.exe
            dist/TidyDrop.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
